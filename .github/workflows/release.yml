name: Release

# Tag convention. Tenants pin `opentalon/talooner@v1`, so `v1` is a floating tag
# that this workflow moves; `vX.Y.Z` tags are immutable once released. A tenant
# with 30 repos has 30 independently pinned callers who may not run the cluster,
# which is why v1 must never take a breaking change — that is what v2 is for.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/opentalon/talooner:${{ github.ref_name }}
            ghcr.io/opentalon/talooner:v1

      # A released tag must resolve to one immutable image, so the tag's own
      # commit gets action.yml rewritten to the digest that was just pushed.
      # The tag then moves to that commit; `main` keeps the floating v1 ref.
      - name: Pin action.yml to the published digest
        run: |
          set -euo pipefail
          digest='${{ steps.push.outputs.digest }}'
          test -n "$digest"
          sed -i "s|^  image: docker://ghcr.io/opentalon/talooner:.*|  image: docker://ghcr.io/opentalon/talooner@${digest}|" action.yml
          grep -q "@${digest}" action.yml

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "Pin ${{ github.ref_name }} to ${digest}"
          git tag -f '${{ github.ref_name }}'
          git tag -f v1
          git push --force origin refs/tags/${{ github.ref_name }} refs/tags/v1

      - name: Create the release
        run: gh release create '${{ github.ref_name }}' --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Raw binaries, not archives: gh-talooner's own release workflow downloads
  # these and re-uploads them under gh's extension asset-naming convention
  # (gh-talooner-<os>-<arch>), so the name here only has to be unambiguous,
  # not match gh's format itself.
  build-cli:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build talooner CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X github.com/opentalon/talooner/internal/version.Version=${{ github.ref_name }}" \
            -o "talooner_${GOOS}_${GOARCH}" ./cmd/talooner

      - name: Upload to release
        run: gh release upload '${{ github.ref_name }}' "talooner_${{ matrix.goos }}_${{ matrix.goarch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
